# 发布桌面版。
#
# 流程：npm version patch|minor|major → git push --follow-tags
# 推送 v* 标签后，这里在 Windows 上跑测试、打 NSIS 安装包，并把
#   MCU-Pin-Planner-Setup-<版本>.exe / .blockmap / latest.yml
# 上传到同名 GitHub Release。已安装的客户端读 latest.yml 判断有没有新版本。
#
# 标签必须和 package.json 的 version 一致（npm version 会同时改两处），
# 否则 electron-builder 会把文件传到另一个 Release 上。
#
# 仓库必须是公开的：客户端匿名下载 latest.yml，私有仓库会一律 404。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 package.json 版本 $version 不一致" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # electron-builder 在 Release 不存在时会并发创建两次（.exe 和 .blockmap
      # 各上传到一个同名 Release，latest.yml 就可能落在另一个里）。先建好草稿，
      # 它只往已有草稿里传；全部传完再转正，客户端不会看到半成品。
      - name: Create draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        run: npm run app:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        run: |
          assets=" $(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[].name] | join(" ")') "
          echo "assets:$assets"
          setup="MCU-Pin-Planner-Setup-${GITHUB_REF_NAME#v}.exe"
          for required in latest.yml "$setup" "$setup.blockmap"; do
            case "$assets" in *" $required "*) ;; *) echo "缺少 $required" >&2; exit 1 ;; esac
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
